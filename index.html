<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FR お勉強">
  <title>FR お勉強 Web App</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --ok: #16a34a;
      --ng: #dc2626;
      --warn: #b45309;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #f8fafc; color: var(--text-main);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 12px; overflow-x: hidden;
    }
    header, .toolbar, .filter-panel, .controls, .card-scene, .know-buttons, .nav-buttons, .summary, #cardView { width: 100%; max-width: 480px; }
    header { text-align: center; margin-bottom: 8px; }
    h1 { font-size: 1.15rem; font-weight: 700; color: #1e3a8a; margin-bottom: 2px; }
    #status { font-size: 0.72rem; color: var(--text-sub); }
    #status.error { color: var(--ng); }
    #status.warn { color: var(--warn); }

    /* 表示切替 */
    .toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 8px; }
    .seg-group { display: inline-flex; align-items: center; gap: 6px; }
    .seg-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .seg button {
      border: none; background: #fff; padding: 7px 12px; font-size: 0.8rem; font-weight: 600;
      color: #475569; cursor: pointer; border-right: 1px solid var(--border);
    }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--primary); color: #fff; }
    #hideGroup { display: none; }

    /* 絞り込みパネル */
    .filter-panel { margin-bottom: 8px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
    .filter-panel summary {
      padding: 9px 12px; font-size: 0.82rem; font-weight: 600; color: #334155; cursor: pointer;
      list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    .filter-panel summary::-webkit-details-marker { display: none; }
    .filter-panel summary::after { content: '▾'; color: #94a3b8; }
    .filter-panel[open] summary::after { content: '▴'; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 10px; }
    select, input[type=search] {
      min-width: 0; padding: 8px 8px; border-radius: 10px; border: 1px solid var(--border);
      background: #fff; font-size: 0.82rem; color: #334155; font-family: inherit;
    }
    select { flex: 1 1 130px; }
    input[type=search] { flex: 1 1 100%; }
    .chip {
      flex: 0 0 auto; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #fff; font-size: 0.8rem; color: #475569; cursor: pointer; font-weight: 600;
    }
    .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }
    .mode-btn {
      background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600; color: #334155; cursor: pointer;
    }

    /* カード */
    .card-scene { height: 330px; perspective: 1000px; margin-bottom: 12px; }
    .card {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 40px 24px 32px; text-align: center; overflow: auto;
    }
    .card-back { transform: rotateY(180deg); background: #fcfdfe; }
    .category-label {
      position: absolute; top: 14px; left: 18px; max-width: calc(100% - 80px);
      font-size: 0.72rem; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; line-height: 1.3; text-align: left;
    }
    .audio-btn {
      position: absolute; top: 12px; right: 14px; background: #eff6ff; border: none;
      width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; cursor: pointer; color: var(--primary);
    }
    .fr-text { font-size: 1.45rem; font-weight: 700; color: #0f172a; line-height: 1.35; margin-bottom: 12px; }
    .ipa-text {
      font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif; font-size: 0.92rem; color: #475569;
      background: #f1f5f9; padding: 3px 10px; border-radius: 8px; margin-bottom: 8px;
    }
    .kana-text { font-size: 0.95rem; color: #0369a1; font-weight: 500; }
    .ja-text { font-size: 1.3rem; font-weight: 700; color: #1e293b; line-height: 1.4; margin-bottom: 12px; }
    .sub-note { font-size: 0.8rem; color: #64748b; margin-top: 8px; line-height: 1.5; }
    .meta-line { font-size: 0.7rem; color: #94a3b8; margin-top: 14px; line-height: 1.5; }
    .hint { position: absolute; bottom: 12px; font-size: 0.72rem; color: #94a3b8; }

    .know-buttons, .nav-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn {
      flex: 1; padding: 13px; border: none; border-radius: 14px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-prev { background: #e2e8f0; color: #334155; }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-ng { background: #fee2e2; color: var(--ng); }
    .btn-ok { background: #dcfce7; color: var(--ok); }
    .summary { text-align: center; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; }

    /* 一覧表示 */
    body.list-mode #hideGroup { display: inline-flex; }
    body.list-mode #modeBtn, body.list-mode #cardView { display: none; }
    #listView { display: none; width: 100%; max-width: 900px; }
    body.list-mode #listView { display: block; }
    body.list-mode .toolbar, body.list-mode .filter-panel, body.list-mode .controls, body.list-mode header, body.list-mode .summary { max-width: 900px; }
    .table-wrap { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
    table.vocab { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    table.vocab th {
      position: sticky; top: 0; background: #f1f5f9; color: #475569; font-size: 0.74rem;
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table.vocab td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; line-height: 1.45; }
    table.vocab tr:last-child td { border-bottom: none; }
    table.vocab td, table.vocab th { overflow-wrap: anywhere; }
    td.c-ja { min-width: 9em; }
    td.c-fr { font-weight: 700; color: #0f172a; min-width: 9em; }
    td.c-ipa { font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif; color: #475569; font-size: 0.8rem; min-width: 8em; }
    td.c-kana { color: #0369a1; min-width: 8em; }
    table.hide-ja td.c-ja:not(.shown), table.hide-fr td.c-fr:not(.shown) {
      color: transparent; background: #e2e8f0; user-select: none; -webkit-user-select: none; cursor: pointer;
    }
    table.hide-ja td.c-ja.shown, table.hide-fr td.c-fr.shown { cursor: pointer; }
    @media (max-width: 600px) {
      body.list-mode { padding: 8px; }
      table.vocab { font-size: 0.74rem; table-layout: fixed; }
      table.vocab th { font-size: 0.66rem; padding: 6px 5px; }
      table.vocab td { padding: 7px 5px; line-height: 1.4; }
      td.c-ja, td.c-fr, td.c-ipa, td.c-kana { min-width: 0; }
      td.c-ipa { font-size: 0.68rem; }
      table.vocab th:nth-child(1), table.vocab th:nth-child(2) { width: 29%; }
      table.vocab th:nth-child(3), table.vocab th:nth-child(4) { width: 21%; }
    }
    .list-empty { padding: 24px; text-align: center; color: var(--text-sub); font-size: 0.9rem; }
    .list-hint { font-size: 0.72rem; color: var(--text-sub); text-align: center; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>FR お勉強 Web App</h1>
    <div id="status">読み込み中…</div>
  </header>

  <div class="toolbar">
    <div class="seg-group">
      <span class="seg-label">表示</span>
      <div class="seg" id="viewSeg">
        <button type="button" data-view="card" class="on">カード</button>
        <button type="button" data-view="list">一覧</button>
      </div>
    </div>
    <div class="seg-group" id="hideGroup">
      <span class="seg-label">隠す</span>
      <div class="seg" id="hideSeg">
        <button type="button" data-hide="none" class="on">なし</button>
        <button type="button" data-hide="ja">日本語</button>
        <button type="button" data-hide="fr">フランス語</button>
      </div>
    </div>
  </div>

  <details class="filter-panel" id="filterPanel">
    <summary id="filterSummary">絞り込み・並び順</summary>
    <div class="filters">
      <select id="srcSelect" aria-label="ソース"></select>
      <select id="typeSelect" aria-label="タイプ"></select>
      <select id="cat1Select" aria-label="大カテゴリ"></select>
      <select id="cat2Select" aria-label="小カテゴリ"></select>
      <input type="search" id="searchInput" placeholder="検索：位置・フランス語・日本語（例: 第2回 / Leçon 13 / p.18）">
      <button class="chip" id="unknownBtn">未習得のみ</button>
      <button class="chip" id="shuffleBtn">シャッフル</button>
      <button class="chip" id="resetBtn">リセット</button>
    </div>
  </details>

  <div class="controls">
    <span class="badge" id="cardCounter">- / -</span>
    <button class="mode-btn" id="modeBtn">モード: 仏 ➔ 日</button>
  </div>

  <div id="cardView">
    <div class="card-scene" id="scene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <span class="category-label" id="frontCategory"></span>
          <button class="audio-btn" id="audioBtn" aria-label="発音を聞く">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <div id="frontMain"></div>
          <div class="hint">タップして裏返す</div>
        </div>
        <div class="card-face card-back">
          <span class="category-label" id="backCategory"></span>
          <div id="backMain"></div>
          <div class="hint">タップして戻る</div>
        </div>
      </div>
    </div>

    <div class="know-buttons">
      <button class="btn btn-ng" id="ngBtn">✗ まだ</button>
      <button class="btn btn-ok" id="okBtn">✓ 覚えた</button>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-prev" id="prevBtn">◀ 前へ</button>
      <button class="btn btn-next" id="nextBtn">次へ ▶</button>
    </div>
  </div>

  <div id="listView">
    <div class="table-wrap">
      <table class="vocab" id="vocabTable">
        <thead>
          <tr><th>日本語</th><th>フランス語</th><th>発音記号</th><th>カタカナ</th></tr>
        </thead>
        <tbody id="vocabBody"></tbody>
      </table>
    </div>
    <div class="list-hint" id="listHint"></div>
  </div>

  <div class="summary" id="summary"></div>

  <!-- スプレッドシートのURLは config.js に書く（index.html を差し替えてもURLが消えない） -->
  <script src="config.js"></script>
  <script>
    // config.js が無い・空のときは、同じフォルダの cards.csv を読み込む（動作確認用）
    const SHEET_URL = (typeof SHEET_CSV_URL !== 'undefined' && SHEET_CSV_URL) ? SHEET_CSV_URL : '';
    const LOCAL_CSV = './cards.csv';

    const CACHE_KEY = 'frcards_cache_v2';
    const KNOWN_KEY = 'frcards_known_v1';   // 覚えた記録（IDで保存。旧データのフランス語文字列も引き継ぐ）
    const VIEW_KEY = 'frcards_view_v1';

    let allCards = [];
    let list = [];
    let index = 0;
    let isFrFirst = true;
    let onlyUnknown = false;
    let shuffleOn = false;
    let known = new Set();
    let viewMode = 'card';   // 'card' | 'list'
    let hideCol = 'none';    // 'none' | 'ja' | 'fr'

    const $ = (id) => document.getElementById(id);
    const card = $('card');

    // ---------- 小物 ----------
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function setStatus(msg, kind) {
      const el = $('status');
      el.textContent = msg;
      el.className = kind || '';
    }
    // 検索用：大文字小文字・アクセント記号（ç → c など）を無視
    function fold(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
    function uniq(a) { return [...new Set(a.filter(Boolean))]; }

    // ---------- CSVパーサ（引用符・改行・カンマ対応） ----------
    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQ = false;
      text = text.replace(/^﻿/, '');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; }
          } else { field += c; }
        } else if (c === '"') { inQ = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          if (row.some((v) => v.trim() !== '')) rows.push(row);
          row = [];
        } else { field += c; }
      }
      row.push(field);
      if (row.some((v) => v.trim() !== '')) rows.push(row);
      return rows;
    }

    // 見出し名で列を判定するので、列の順番を入れ替えてもOK。
    // 旧フォーマット（回／カテゴリ）のシートも読める。
    function parseCards(text) {
      const rows = parseCSV(text);
      if (rows.length < 2) return { cards: [], warnings: [] };
      const head = rows[0].map((h) => h.trim());
      const col = (name) => head.indexOf(name);
      const idx = {
        id: col('ID'), source: col('ソース'), pos: col('位置'), type: col('タイプ'),
        cat1: col('大カテゴリ'), cat2: col('小カテゴリ'),
        fr: col('フランス語'), ipa: col('IPA'), kana: col('カナ'), ja: col('日本語'), note: col('メモ'),
        oldLesson: col('回'), oldCat: col('カテゴリ'),
      };
      if (idx.fr < 0 || idx.ja < 0) throw new Error('見出し行に「フランス語」「日本語」の列がありません');
      const get = (r, i) => (i >= 0 && r[i] != null ? r[i].trim() : '');
      const cards = rows.slice(1).map((r) => {
        const fr = get(r, idx.fr);
        const lesson = get(r, idx.oldLesson);
        return {
          id: get(r, idx.id) || fr,   // ID列が無い／空のときはフランス語で代用
          hasId: !!get(r, idx.id),
          source: get(r, idx.source),
          pos: get(r, idx.pos) || (lesson ? '第' + lesson + '回' : ''),
          type: get(r, idx.type),
          cat1: get(r, idx.cat1) || get(r, idx.oldCat),
          cat2: get(r, idx.cat2),
          fr, ja: get(r, idx.ja),
          ipa: get(r, idx.ipa), kana: get(r, idx.kana), note: get(r, idx.note),
        };
      }).filter((c) => c.fr && c.ja);
      cards.forEach((c) => {
        c._hay = fold([c.id, c.source, c.pos, c.type, c.cat1, c.cat2, c.fr, c.ja, c.kana, c.note].join(' '));
      });
      // データのチェック（ID重複・空欄）
      const warnings = [];
      if (idx.id >= 0) {
        const empty = cards.filter((c) => !c.hasId).length;
        if (empty) warnings.push('IDが空欄の行が' + empty + '件あります');
        const seen = new Set(), dup = new Set();
        cards.forEach((c) => { if (c.hasId) { if (seen.has(c.id)) dup.add(c.id); seen.add(c.id); } });
        if (dup.size) warnings.push('IDが重複しています: ' + [...dup].slice(0, 5).join(', ') + (dup.size > 5 ? ' ほか' : ''));
      }
      return { cards, warnings };
    }

    // ---------- 読み込み ----------
    async function load() {
      const url = SHEET_URL
        ? SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now()
        : LOCAL_CSV;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const { cards, warnings } = parseCards(text);
        if (!cards.length) throw new Error('カードが0件でした');
        safeSet(CACHE_KEY, text);
        const base = (SHEET_URL ? 'スプレッドシートから' : 'cards.csvから') + ' ' + cards.length + '枚を読み込みました';
        setStatus(warnings.length ? base + '　⚠ ' + warnings.join(' / ') : base, warnings.length ? 'warn' : '');
        start(cards);
      } catch (e) {
        const cached = safeGet(CACHE_KEY);
        if (cached) {
          try {
            const { cards } = parseCards(cached);
            if (cards.length) {
              setStatus('オフライン：前回取得したデータ（' + cards.length + '枚）を表示中');
              start(cards);
              return;
            }
          } catch (e2) {}
        }
        setStatus('読み込みに失敗しました: ' + e.message + '（ファイルを直接開いている場合は、公開したURLから開いてください）', 'error');
        $('frontMain').innerHTML = '<div class="ja-text">データを読み込めません</div>';
      }
    }

    function start(cards) {
      allCards = cards;
      try { known = new Set(JSON.parse(safeGet(KNOWN_KEY) || '[]')); } catch (e) { known = new Set(); }
      // 旧版（フランス語の文字列で記録）の「覚えた」をIDに引き継ぐ
      allCards.forEach((c) => { if (known.has(c.fr)) known.add(c.id); });
      buildFilters();
      try {
        const v = JSON.parse(safeGet(VIEW_KEY) || '{}');
        hideCol = (v.hide === 'ja' || v.hide === 'fr') ? v.hide : 'none';
        viewMode = v.view === 'list' ? 'list' : 'card';
      } catch (e) {}
      document.querySelectorAll('#hideSeg button').forEach((b) => b.classList.toggle('on', b.dataset.hide === hideCol));
      setView(viewMode);
      rebuild();
    }

    // ---------- 絞り込み（選択肢はデータから自動生成） ----------
    function fillSelect(sel, values, allLabel) {
      sel.innerHTML = '<option value="all">' + esc(allLabel) + '</option>' +
        values.map((v) => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
    }
    function fillCat2() {
      const c1 = $('cat1Select').value;
      const pool = c1 === 'all' ? allCards : allCards.filter((c) => c.cat1 === c1);
      fillSelect($('cat2Select'), uniq(pool.map((c) => c.cat2)), 'すべての小カテゴリ');
    }
    function buildFilters() {
      fillSelect($('srcSelect'), uniq(allCards.map((c) => c.source)), 'すべてのソース');
      fillSelect($('typeSelect'), uniq(allCards.map((c) => c.type)), 'すべてのタイプ');
      fillSelect($('cat1Select'), uniq(allCards.map((c) => c.cat1)), 'すべての大カテゴリ');
      fillCat2();
    }

    function shuffleArray(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function rebuild() {
      const src = $('srcSelect').value, type = $('typeSelect').value;
      const c1 = $('cat1Select').value, c2 = $('cat2Select').value;
      const q = $('searchInput').value.trim();
      const tokens = fold(q).split(/\s+/).filter(Boolean);
      list = allCards.filter((c) =>
        (src === 'all' || c.source === src) &&
        (type === 'all' || c.type === type) &&
        (c1 === 'all' || c.cat1 === c1) &&
        (c2 === 'all' || c.cat2 === c2) &&
        tokens.every((t) => c._hay.includes(t)) &&
        (!onlyUnknown || !known.has(c.id))
      );
      if (shuffleOn) shuffleArray(list);
      index = 0;
      const active = [src, type, c1, c2].filter((v) => v !== 'all').length + (q ? 1 : 0) + (onlyUnknown ? 1 : 0) + (shuffleOn ? 1 : 0);
      $('filterSummary').textContent = '絞り込み・並び順' + (active ? '（' + active + '）' : '');
      render();
      renderList();
    }

    function resetFilters() {
      ['srcSelect', 'typeSelect', 'cat1Select'].forEach((id) => { $(id).value = 'all'; });
      fillCat2();
      $('searchInput').value = '';
      onlyUnknown = false; shuffleOn = false;
      $('unknownBtn').classList.remove('on');
      $('shuffleBtn').classList.remove('on');
      rebuild();
    }

    // ---------- 描画 ----------
    function updateCounter() {
      if (viewMode === 'list') $('cardCounter').textContent = list.length + '枚';
      else $('cardCounter').textContent = list.length ? (index + 1) + ' / ' + list.length : '0 / 0';
    }

    function render() {
      card.classList.remove('flipped');
      updateSummary();
      updateCounter();
      if (!list.length) {
        $('frontCategory').textContent = '';
        $('backCategory').textContent = '';
        $('frontMain').innerHTML = '<div class="ja-text">該当するカードがありません</div>';
        $('backMain').innerHTML = '';
        return;
      }
      const item = list[index];
      const mark = known.has(item.id) ? ' ✓' : '';
      const frBlock =
        '<div class="fr-text">' + esc(item.fr) + '</div>' +
        (item.ipa ? '<div class="ipa-text">' + esc(item.ipa) + '</div>' : '') +
        (item.kana ? '<div class="kana-text">' + esc(item.kana) + '</div>' : '');
      const note = item.note ? '<div class="sub-note">💡 ' + esc(item.note) + '</div>' : '';
      const where = [item.source, item.pos].filter(Boolean).join(' ');
      const what = [item.type, [item.cat1, item.cat2].filter(Boolean).join(' › ')].filter(Boolean).join(' ｜ ');
      const meta = (where || what)
        ? '<div class="meta-line">' + esc(where) + (where && what ? '<br>' : '') + esc(what) + '</div>' : '';
      const cat = item.cat2 || item.cat1;

      if (isFrFirst) {
        $('frontCategory').textContent = cat + mark;
        $('frontMain').innerHTML = frBlock;
        $('backCategory').textContent = '日本語訳';
        $('backMain').innerHTML = '<div class="ja-text">' + esc(item.ja) + '</div>' + note + meta;
      } else {
        $('frontCategory').textContent = '日本語' + mark;
        $('frontMain').innerHTML = '<div class="ja-text">' + esc(item.ja) + '</div>';
        $('backCategory').textContent = cat;
        $('backMain').innerHTML = frBlock + note + meta;
      }
    }

    function updateSummary() {
      const k = allCards.filter((c) => known.has(c.id)).length;
      $('summary').textContent = '覚えた ' + k + ' / 全' + allCards.length + '枚（この端末に保存）';
    }

    // ---------- 一覧表示 ----------
    function renderList() {
      const body = $('vocabBody');
      const tbl = $('vocabTable');
      tbl.classList.toggle('hide-ja', hideCol === 'ja');
      tbl.classList.toggle('hide-fr', hideCol === 'fr');
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="4" class="list-empty">該当するカードがありません</td></tr>';
      } else {
        body.innerHTML = list.map((c) =>
          '<tr>' +
          '<td class="c-ja">' + esc(c.ja) + '</td>' +
          '<td class="c-fr">' + esc(c.fr) + '</td>' +
          '<td class="c-ipa">' + esc(c.ipa) + '</td>' +
          '<td class="c-kana">' + esc(c.kana) + '</td>' +
          '</tr>'
        ).join('');
      }
      $('listHint').textContent = hideCol === 'none' ? '' : '隠れているセルをタップすると、その行だけ表示されます';
      updateCounter();
    }

    function saveView() { safeSet(VIEW_KEY, JSON.stringify({ view: viewMode, hide: hideCol })); }

    function setView(v) {
      viewMode = v === 'list' ? 'list' : 'card';
      document.body.classList.toggle('list-mode', viewMode === 'list');
      document.querySelectorAll('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.view === viewMode));
      if (viewMode === 'list') renderList(); else updateCounter();
      saveView();
    }

    function setHide(h) {
      hideCol = (h === 'ja' || h === 'fr') ? h : 'none';
      document.querySelectorAll('#hideSeg button').forEach((b) => b.classList.toggle('on', b.dataset.hide === hideCol));
      renderList();
      saveView();
    }

    // ---------- 操作 ----------
    function flipCard() { if (list.length) card.classList.toggle('flipped'); }
    function nextCard() { if (!list.length) return; index = (index + 1) % list.length; render(); }
    function prevCard() { if (!list.length) return; index = (index - 1 + list.length) % list.length; render(); }

    function mark(isKnown) {
      if (!list.length) return;
      const id = list[index].id;
      if (isKnown) known.add(id); else known.delete(id);
      safeSet(KNOWN_KEY, JSON.stringify([...known]));
      nextCard();
    }

    function playAudio(e) {
      e.stopPropagation();
      if (!list.length || !window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(list[index].fr);
      u.lang = 'fr-FR';
      u.rate = 0.85;
      const v = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith('fr'));
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    card.addEventListener('click', flipCard);
    $('audioBtn').addEventListener('click', playAudio);
    $('nextBtn').addEventListener('click', nextCard);
    $('prevBtn').addEventListener('click', prevCard);
    $('okBtn').addEventListener('click', () => mark(true));
    $('ngBtn').addEventListener('click', () => mark(false));
    $('srcSelect').addEventListener('change', rebuild);
    $('typeSelect').addEventListener('change', rebuild);
    $('cat1Select').addEventListener('change', () => { fillCat2(); rebuild(); });
    $('cat2Select').addEventListener('change', rebuild);
    $('searchInput').addEventListener('input', rebuild);
    $('resetBtn').addEventListener('click', resetFilters);
    $('modeBtn').addEventListener('click', () => {
      isFrFirst = !isFrFirst;
      $('modeBtn').textContent = isFrFirst ? 'モード: 仏 ➔ 日' : 'モード: 日 ➔ 仏';
      render();
    });
    $('unknownBtn').addEventListener('click', () => {
      onlyUnknown = !onlyUnknown;
      $('unknownBtn').classList.toggle('on', onlyUnknown);
      rebuild();
    });
    $('shuffleBtn').addEventListener('click', () => {
      shuffleOn = !shuffleOn;
      $('shuffleBtn').classList.toggle('on', shuffleOn);
      rebuild();
    });
    document.querySelectorAll('#viewSeg button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
    document.querySelectorAll('#hideSeg button').forEach((b) => b.addEventListener('click', () => setHide(b.dataset.hide)));
    // 隠れているセルをタップ → その行だけ見える（もう一度タップで隠す）
    $('vocabBody').addEventListener('click', (e) => {
      const td = e.target.closest('td.c-ja, td.c-fr');
      if (td) td.classList.toggle('shown');
    });

    // キーボード（PC用・カード表示のときだけ）
    document.addEventListener('keydown', (e) => {
      const t = e.target.tagName;
      if (t === 'SELECT' || t === 'INPUT' || viewMode !== 'card') return;
      if (e.key === 'ArrowRight') nextCard();
      else if (e.key === 'ArrowLeft') prevCard();
      else if (e.key === ' ') { e.preventDefault(); flipCard(); }
    });

    // スワイプ（スマホ用）
    let touchStartX = 0;
    $('scene').addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    $('scene').addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (dx < -50) nextCard();
      if (dx > 50) prevCard();
    }, { passive: true });

    if (window.speechSynthesis) speechSynthesis.getVoices();
    load();
  </script>
</body>
</html>
